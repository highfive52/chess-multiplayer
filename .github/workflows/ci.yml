# .github/workflows/ci.yml
name: Code Quality & Testing (CI)

on:
  push:
    branches: [ main, frontend, backend ]
  pull_request:
    branches: [ main, frontend, backend ]

jobs:
  lint-and-format:
    name: Lint & Format Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- PYTHON BACKEND CHECKS ---
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Backend Dependencies
        run: |
          cd backend
          uv sync

      - name: Run Python Lint (Ruff)
        run: uv run --directory backend ruff check .

      - name: Run Python Format Check (Ruff)
        run: uv run --directory backend ruff format --check .

      # --- TYPESCRIPT FRONTEND CHECKS ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Format Check (Prettier)
        run: npm run format --prefix frontend -- --check

      - name: Run Frontend Lint (ESLint)
        run: npm run lint --prefix frontend

  test-backend:
    name: Run Backend Pytest Suite
    needs: lint-and-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Backend Dependencies
        run: |
          cd backend
          uv sync

      - name: Run Backend Tests
        run: uv run --directory backend pytest

  test-frontend:
    name: Run Frontend Tests
    needs: lint-and-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: npm run test --prefix frontend