# .github/workflows/ci.yml
name: Code Quality & Testing (CI)

on:
  push:
    branches: [main, frontend, backend]
  pull_request:
    branches: [main, frontend, backend]

jobs:
  lint-and-format:
    name: Lint & Format Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- PYTHON CHECKS ---
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python Dependencies
        run: uv sync --frozen

      - name: Run Python Lint (Ruff)
        run: uv run --package backend ruff check apps/backend

      - name: Run Python Format Check (Ruff)
        run: uv run --package backend ruff format --check apps/backend

      # --- TYPESCRIPT FRONTEND CHECKS ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Format Check (Prettier)
        run: npm run format --prefix frontend -- --check

      - name: Run Frontend Lint (ESLint)
        run: npm run lint --prefix frontend

  test-backend:
    name: Run Backend Pytest Suite
    needs: lint-and-format
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python Dependencies
        run: uv sync --frozen

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chess_test
        run: uv run --package backend alembic -c apps/backend/alembic.ini upgrade head

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chess_test
        run: uv run --package backend pytest apps/backend/tests
  
  test-ml:
    name: Run ML Pytest Suite
    needs: lint-and-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python Dependencies
        run: uv sync --frozen

      - name: Run ML Tests
        run: uv run --package chess-ml pytest apps/trainer/tests packages/chess_core/tests

  test-frontend:
    name: Run Frontend Tests
    needs: lint-and-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: npm run test --prefix frontend