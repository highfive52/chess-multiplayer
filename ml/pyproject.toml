[project]
name = "chess-ml"
version = "0.1.0"
description = "Supervised machine learning components for chess move prediction."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "httpx>=0.28.1",
    "python-chess>=1.999",
]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
packages = ["chess_ml"]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]