[project]
name = "chess-ml"
version = "0.1.0"
description = "Supervised machine learning components for chess move prediction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "ipykernel>=7.3.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "python-chess>=1.999",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chess_ml"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
