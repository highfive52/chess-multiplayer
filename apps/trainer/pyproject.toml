[project]
name = "chess-ml"
version = "0.1.0"
description = "Supervised machine learning components for chess move prediction."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "chess-core",
    "datasets>=3.1.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.31.0",
    "onnx>=1.17.0",
    "onnxscript>=0.5.6",
    "python-chess>=1.999",
    "safetensors>=0.4.5",
    "torch>=2.14.0",
]

[tool.uv.sources]
chess-core = { workspace = true }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dataset", "model", "training", "evaluation", "model_artifacts", "train"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
