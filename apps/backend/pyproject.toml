[project]
name = "backend"
version = "0.1.0"
description = "Chess multiplayer backend."
readme = "README.md"
authors = [
    { name = "Eric Dyke", email = "hello@ericdyke.com" }
]
requires-python = ">=3.12"

dependencies = [
    "chess-core",
    "chess-ml",
    "fastapi>=0.136.3",
    "psycopg[binary]>=3.3.5",
    "python-chess>=1.999",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "python-socketio>=5.16.2",
    "redis>=8.0.0",
    "uvicorn>=0.48.0",
]


[tool.uv.sources]
chess-core = { workspace = true }
chess-ml = { workspace = true }


[project.scripts]
backend = "main:main"


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
py-modules = ["main", "validator"]
packages = ["database", "repositories", "schemas", "services"]


[dependency-groups]
dev = [
    "alembic>=1.14.1",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]