# .pre-commit-config.yaml
repos:
  - repo: local
    hooks:
      # --- PYTHON BACKEND ---
      - id: ruff-check
        name: Ruff check & fix
        entry: uv run --directory backend ruff check . --fix
        language: system
        pass_filenames: false
        files: ^backend/

      - id: ruff-format
        name: Ruff format
        entry: uv run --directory backend ruff format .
        language: system
        pass_filenames: false
        files: ^backend/

      - id: pytest
        name: Backend tests
        entry: uv run --directory backend pytest -q
        language: system
        pass_filenames: false
        files: ^backend/

      # --- TYPESCRIPT FRONTEND ---
      - id: prettier
        name: Prettier format
        entry: npm --prefix frontend run format
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: eslint
        name: Frontend lint
        entry: npm --prefix frontend run lint --silent
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: frontend-tests
        name: Frontend tests
        entry: npm --prefix frontend run test
        language: system
        pass_filenames: false
        files: ^frontend/