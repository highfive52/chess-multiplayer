# .pre-commit-config.yaml
repos:
  - repo: local
    hooks:
      # --- PYTHON BACKEND ---
      - id: ruff-check
        name: Ruff check & fix
        entry: uv run --package backend ruff check . --fix
        language: system
        pass_filenames: false
        files: ^backend/

      - id: ruff-format
        name: Ruff format
        entry: uv run --package backend ruff format .
        language: system
        pass_filenames: false
        files: ^backend/

      - id: pytest-backend
        name: Backend tests
        entry: uv run --group local-inference pytest -q backend/tests
        language: system
        pass_filenames: false
        files: ^backend/

      # --- PYTHON ML ---
      - id: pytest-ml
        name: ML tests
        entry: uv run --group local-inference pytest -q ml/tests
        language: system
        pass_filenames: false
        files: ^ml/

      # --- TYPESCRIPT FRONTEND ---
      - id: prettier
        name: Prettier format
        entry: npm --prefix frontend run format
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: eslint
        name: Frontend lint
        entry: npm --prefix frontend run lint --silent
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: frontend-tests
        name: Frontend tests
        entry: npm --prefix frontend run test
        language: system
        pass_filenames: false
        files: ^frontend/