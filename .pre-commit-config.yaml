# .pre-commit-config.yaml
repos:
  - repo: local
    hooks:
      # --- PYTHON BACKEND ---
      - id: ruff-check
        name: Ruff check
        entry: bash -c 'cd backend && uv run ruff check .'
        language: system
        pass_filenames: false
        files: ^backend/

      - id: ruff-format
        name: Ruff format
        entry: bash -c 'cd backend && uv run ruff format .'
        language: system
        pass_filenames: false
        files: ^backend/

      - id: pytest
        name: Backend tests
        entry: bash -c 'cd backend && uv run pytest -q'
        language: system
        pass_filenames: false
        files: ^backend/

      # --- TYPESCRIPT FRONTEND ---
      - id: prettier
        name: Prettier format
        entry: npm --prefix frontend run format
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: eslint
        name: Frontend lint
        entry: npm --prefix frontend run lint --silent
        language: system
        pass_filenames: false
        files: ^frontend/